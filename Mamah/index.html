<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Untuk Mamah — 47</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #050505;
    --deep: #0A0A0A;
    --gold: #D6B25E;
    --gold-light: #E8CC8A;
    --gold-dim: rgba(214,178,94,0.4);
    --white: #F5F5F0;
    --white-dim: rgba(245,245,240,0.7);
    --white-faint: rgba(245,245,240,0.35);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--white);
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
    cursor: default;
    user-select: none;
  }

  /* ─── CANVAS PARTICLES ─── */
  #particles-canvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
  }

  /* ─── VIGNETTE ─── */
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(0,0,0,0.55) 70%,
      rgba(0,0,0,0.92) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* ─── MUSIC BUTTON ─── */
  #music-btn {
    position: fixed; top: 24px; right: 24px;
    z-index: 100;
    width: 42px; height: 42px;
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    background: rgba(5,5,5,0.7);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 0.3s, opacity 0.3s;
    opacity: 0;
  }
  #music-btn.visible { opacity: 1; }
  #music-btn:hover { border-color: var(--gold); }
  #music-btn svg { width: 16px; height: 16px; fill: var(--gold); }

  /* ─── PROGRESS DOTS ─── */
  #progress-dots {
    position: fixed; right: 20px; top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: flex; flex-direction: column; gap: 8px;
    opacity: 0; transition: opacity 0.6s;
  }
  #progress-dots.visible { opacity: 1; }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--white-faint);
    transition: all 0.4s ease;
    cursor: pointer;
  }
  .dot.active { background: var(--gold); transform: scale(1.5); }

  /* ─── SCENES WRAPPER ─── */
  #scenes {
    position: fixed; inset: 0;
    z-index: 3;
  }

  /* ─── SCENE BASE ─── */
  .scene {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(0.4,0,0.2,1);
    pointer-events: none;
  }
  .scene.active {
    opacity: 1;
    pointer-events: all;
  }
  .scene.exiting { opacity: 0; }

  /* ─── SCENE 0 — OPENING ─── */
  #scene-opening {
    background: var(--black);
    flex-direction: column;
    text-align: center;
    gap: 0;
  }
  .opening-glow {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle,
      rgba(214,178,94,0.07) 0%,
      transparent 70%);
    border-radius: 50%;
    animation: breathe 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
  }

  .opening-dedication {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 20px;
    padding: 0 32px;
  }
  .ded-line1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 4vw, 28px);
    font-weight: 300;
    letter-spacing: 0.25em;
    color: var(--gold);
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 1.4s ease 0.6s forwards;
  }
  .ded-line2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 4.5vw, 34px);
    font-weight: 400;
    font-style: italic;
    color: var(--white);
    line-height: 1.5;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 1.4s ease 2.2s forwards;
    max-width: 520px;
  }
  .ded-line2 em {
    color: var(--gold-light);
    font-style: normal;
  }
  .ded-divider {
    width: 40px; height: 1px;
    background: var(--gold-dim);
    opacity: 0;
    animation: fadeUp 1s ease 3.8s forwards;
    margin: 8px 0;
  }

  #start-btn {
    margin-top: 20px;
    opacity: 0;
    animation: fadeUp 1s ease 4.4s forwards;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 40px;
    border: 1px solid var(--gold-dim);
    border-radius: 2px;
    background: transparent;
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.4s, border-color 0.4s, color 0.4s;
    position: relative; overflow: hidden;
  }
  #start-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }
  #start-btn:hover::before { transform: scaleX(1); }
  #start-btn:hover { color: var(--black); border-color: var(--gold); }
  #start-btn span { position: relative; z-index: 1; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── PHOTO SCENES ─── */
  .photo-scene {
    background: var(--black);
  }
  .photo-bg {
    position: absolute; inset: -5%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform: scale(1);
    transition: transform 8s cubic-bezier(0.25,0.46,0.45,0.94);
    filter: brightness(0.55) saturate(0.8);
  }
  .photo-scene.active .photo-bg {
    transform: scale(1.1);
  }

  /* Gradient overlays */
  .photo-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5,5,5,0.6) 0%,
      transparent 30%,
      transparent 60%,
      rgba(5,5,5,0.75) 100%
    );
    z-index: 1;
  }

  .photo-content {
    position: relative; z-index: 5;
    text-align: center;
    padding: 0 clamp(24px, 8vw, 100px);
    max-width: 760px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1.2s ease 0.6s, transform 1.2s ease 0.6s;
  }
  .photo-scene.active .photo-content {
    opacity: 1;
    transform: translateY(0);
  }

  .scene-number {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
  }
  .photo-caption {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 400;
    font-style: italic;
    line-height: 1.5;
    color: var(--white);
    text-shadow: 0 2px 30px rgba(0,0,0,0.8);
  }
  .photo-caption em {
    font-style: normal;
    color: var(--gold-light);
  }
  .caption-bar {
    width: 30px; height: 1px;
    background: var(--gold);
    margin: 20px auto;
    opacity: 0.6;
  }
  .photo-sub {
    font-size: clamp(13px, 2.5vw, 16px);
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--white-dim);
    line-height: 1.7;
    font-style: italic;
  }

  /* ─── NAV ARROWS ─── */
  .nav-hint {
    position: absolute; bottom: 36px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    opacity: 0;
    transition: opacity 0.6s ease 1.2s;
    cursor: pointer;
  }
  .photo-scene.active .nav-hint { opacity: 0.5; }
  .nav-hint:hover { opacity: 0.9 !important; }
  .nav-hint-text {
    font-size: 10px; letter-spacing: 0.3em;
    color: var(--gold); text-transform: uppercase;
    font-family: 'Cormorant Garamond', serif;
  }
  .nav-hint-arrow {
    width: 20px; height: 20px;
    border-right: 1px solid var(--gold);
    border-bottom: 1px solid var(--gold);
    transform: rotate(45deg);
    animation: arrowBounce 2s ease-in-out infinite;
  }
  @keyframes arrowBounce {
    0%,100% { transform: rotate(45deg) translateY(0); }
    50% { transform: rotate(45deg) translateY(4px); }
  }

  /* ─── SCENE FINAL ─── */
  #scene-final {
    background: var(--black);
    flex-direction: column;
    text-align: center;
    gap: 0;
  }
  .final-glow {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle,
      rgba(214,178,94,0.09) 0%,
      rgba(200,120,60,0.04) 40%,
      transparent 70%);
    border-radius: 50%;
    animation: breathe 5s ease-in-out infinite;
  }

  .final-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 0 32px;
    opacity: 0;
    transition: opacity 1.5s ease 0.4s, transform 1.5s ease 0.4s;
    transform: translateY(16px);
  }
  #scene-final.active .final-content {
    opacity: 1; transform: translateY(0);
  }

  .final-year {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(11px, 2.5vw, 14px);
    letter-spacing: 0.5em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .final-line1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 400;
    font-style: italic;
    color: var(--white);
    line-height: 1.3;
  }
  .final-line1 span { color: var(--gold); }
  .final-line2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 3.5vw, 26px);
    font-weight: 300;
    font-style: italic;
    color: var(--white-dim);
    line-height: 1.6;
    max-width: 500px;
    margin-top: 8px;
  }

  .heart-container {
    margin: 24px 0;
    position: relative;
  }
  .heart-svg {
    width: 52px; height: 52px;
    animation: heartPulse 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 16px rgba(214,178,94,0.5));
  }
  @keyframes heartPulse {
    0%,100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(214,178,94,0.4)); }
    50% { transform: scale(1.12); filter: drop-shadow(0 0 28px rgba(214,178,94,0.8)); }
  }

  .final-greeting {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin: 4px 0 16px;
  }
  .final-from {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 2.5vw, 17px);
    font-weight: 300;
    font-style: italic;
    color: var(--white-faint);
    letter-spacing: 0.15em;
  }

  /* ─── SCENE OUTRO ─── */
  #scene-outro {
    background: var(--black);
    flex-direction: column;
    gap: 24px;
    text-align: center;
  }
  .outro-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 20px;
    opacity: 0;
    transition: opacity 1.2s ease 0.4s;
  }
  #scene-outro.active .outro-content { opacity: 1; }

  .outro-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px; letter-spacing: 0.5em;
    color: var(--gold-dim); text-transform: uppercase;
  }
  .outro-tagline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(15px, 3vw, 22px);
    font-style: italic; font-weight: 300;
    color: var(--white-dim);
  }

  #replay-btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 44px;
    border: 1px solid var(--gold-dim);
    border-radius: 2px;
    background: transparent;
    color: var(--gold);
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s;
    margin-top: 8px;
  }
  #replay-btn:hover {
    background: var(--gold);
    color: var(--black);
    border-color: var(--gold);
  }

  /* ─── LOADING ─── */
  #loading-screen {
    position: fixed; inset: 0;
    background: var(--black);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    transition: opacity 1s ease;
  }
  #loading-screen.fade-out { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-family: 'Playfair Display', serif;
    font-size: 15px; letter-spacing: 0.4em;
    color: var(--gold-dim); text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  .loading-bar-wrap {
    width: 160px; height: 1px;
    background: rgba(214,178,94,0.15);
  }
  .loading-bar {
    height: 100%; background: var(--gold);
    width: 0; transition: width 0.1s linear;
  }
  /* ─── FILM GRAIN ─── */
  .grain-overlay {
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 50;
    opacity: 0.4;
    animation: grainShift 0.15s steps(1) infinite;
  }
  @keyframes grainShift {
    0% { transform: translate(0,0); }
    20% { transform: translate(-2px,2px); }
    40% { transform: translate(2px,-2px); }
    60% { transform: translate(-1px,3px); }
    80% { transform: translate(3px,-1px); }
    100% { transform: translate(0,0); }
  }

  /* ─── TOUCH SWIPE AREAS ─── */
  #swipe-area {
    position: fixed; inset: 0;
    z-index: 4;
    pointer-events: none;
  }
  #swipe-area.active { pointer-events: all; }

  /* ─── SCENE COUNTER ─── */
  #scene-counter {
    position: fixed; left: 24px; bottom: 28px;
    z-index: 100;
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px; letter-spacing: 0.3em;
    color: var(--gold-dim);
    opacity: 0; transition: opacity 0.6s;
  }
  #scene-counter.visible { opacity: 1; }

  /* ─── CLICK-TO-CONTINUE (for photo scenes) ─── */
  .click-zone {
    position: absolute; inset: 0;
    z-index: 6;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .opening-glow { width: 90vw; height: 90vw; }
    .final-glow { width: 90vw; height: 90vw; }
    #progress-dots { display: none; }
    #scene-counter { display: none; }
  }
</style>
</head>
<body>

<!-- Film grain -->
<div class="grain-overlay"></div>

<!-- Particles canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Vignette -->
<div class="vignette"></div>

<!-- Loading -->
<div id="loading-screen">
  <div class="loading-logo">Memuat kenangan…</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
</div>

<!-- Music -->
<audio id="bg-music" loop preload="auto">
  <source src="assets/music/music.mp3" type="audio/mpeg"/>
</audio>

<!-- Music button -->
<button id="music-btn" title="Mute/Unmute" onclick="toggleMusic()">
  <svg id="icon-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
  <svg id="icon-mute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
</button>

<!-- Progress dots -->
<div id="progress-dots"></div>

<!-- Scene counter -->
<div id="scene-counter"></div>

<!-- Swipe area -->
<div id="swipe-area"></div>

<!-- SCENES -->
<div id="scenes">

  <!-- SCENE 0: OPENING -->
  <div class="scene active" id="scene-opening">
    <div class="opening-glow"></div>
    <div class="opening-dedication">
      <div class="ded-line1">Untuk Mamah…</div>
      <div class="ded-line2">Yang Selalu Ada, Bahkan Saat<br><em>Dunia Tidak.</em></div>
      <div class="ded-divider"></div>
      <button id="start-btn" onclick="startFilm()">
        <span>Mulai &nbsp;❤</span>
      </button>
    </div>
  </div>

  <!-- PHOTO SCENES (1–11) — populated by JS -->

  <!-- SCENE FINAL -->
  <div class="scene" id="scene-final">
    <div class="final-glow"></div>
    <div class="final-content">
      <div class="final-year">H A P P Y &nbsp; B I R T H D A Y</div>
      <div class="final-line1"><span>47</span> tahun cinta…</div>
      <div class="final-line2">dan aku masih akan selalu membutuhkan mamah.</div>
      <div class="heart-container">
        <svg class="heart-svg" viewBox="0 0 100 100">
          <path d="M50 85 C50 85 10 58 10 32 C10 18 21 8 35 8 C42 8 48 12 50 16 C52 12 58 8 65 8 C79 8 90 18 90 32 C90 58 50 85 50 85Z" fill="#D6B25E"/>
        </svg>
      </div>
      <div class="final-greeting">Selamat Ulang Tahun ❤</div>
      <div class="final-from">Dari anakmu yang selalu mencintaimu</div>
    </div>
    <div class="nav-hint" onclick="nextScene()">
      <div class="nav-hint-text">Lanjut</div>
      <div class="nav-hint-arrow"></div>
    </div>
  </div>

  <!-- SCENE OUTRO -->
  <div class="scene" id="scene-outro">
    <div class="final-glow" style="opacity:0.5"></div>
    <div class="outro-content">
      <div class="outro-title">F I N</div>
      <div class="outro-tagline">Semoga setiap harimu<br/>dipenuhi cahaya seperti yang kamu bawa</div>
      <button id="replay-btn" onclick="replayFilm()">
        ↺ &nbsp; Putar Lagi
      </button>
    </div>
  </div>

</div><!-- /scenes -->

<script>

    sub: "menjadi anakmu, setiap hari tanpa henti."
  },
  {
    image: "assets/images/photo11.jpg",
    caption: "Karena kaulah alasan aku tahu…",
    sub: "seperti apa rasanya dicintai dengan sepenuh jiwa."
  }
];

/* ═══════════════════════════════════════════
   SCENE MANAGEMENT
═══════════════════════════════════════════ */
let currentScene = 0;
let totalScenes = 0;
let isTransitioning = false;
let musicStarted = false;
let musicMuted = false;
const audio = document.getElementById('bg-music');

// Build photo scenes
function buildPhotoScenes() {
  const scenesEl = document.getElementById('scenes');
  const finalScene = document.getElementById('scene-final');

  slides.forEach((slide, i) => {
    const div = document.createElement('div');
    div.className = 'scene photo-scene';
    div.id = `scene-photo-${i}`;
    div.innerHTML = `
      <div class="photo-overlay"></div>
      <div class="photo-content">
        <div class="scene-number">— ${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')} —</div>
        <div class="photo-caption">${slide.caption}</div>
        <div class="caption-bar"></div>
        <div class="photo-sub">${slide.sub}</div>
      </div>
      <div class="nav-hint" onclick="nextScene()">
        <div class="nav-hint-text">Lanjut</div>
        <div class="nav-hint-arrow"></div>
      </div>
    `;
    scenesEl.insertBefore(div, finalScene);
  });

  // Build dots
  totalScenes = 2 + slides.length + 1; // opening + photos + final + outro
  const dotsEl = document.getElementById('progress-dots');
  for (let i = 0; i < totalScenes - 1; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goToScene(i);
    dotsEl.appendChild(dot);
  }
}

function getAllScenes() {
  return document.querySelectorAll('.scene');
}

function goToScene(idx) {
  if (isTransitioning) return;
  const all = getAllScenes();
  if (idx < 0 || idx >= all.length) return;

  isTransitioning = true;
  const prev = all[currentScene];
  const next = all[idx];

  prev.classList.add('exiting');
  setTimeout(() => {
    prev.classList.remove('active','exiting');
    next.classList.add('active');
    currentScene = idx;
    updateUI();
    isTransitioning = false;
  }, 1200);
}

function nextScene() {
  const all = getAllScenes();
  if (currentScene < all.length - 1) {
    goToScene(currentScene + 1);
  }
}

function updateUI() {
  // Dots
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d,i) => d.classList.toggle('active', i === currentScene));

  // Counter
  const counter = document.getElementById('scene-counter');
  const isPhoto = currentScene >= 1 && currentScene <= slides.length;
  if (isPhoto) {
    counter.textContent = `${currentScene} / ${slides.length}`;
    counter.classList.add('visible');
  } else {
    counter.classList.remove('visible');
  }

  // Progress dots visibility
  const dotsEl = document.getElementById('progress-dots');
  dotsEl.classList.toggle('visible', currentScene > 0);

  // Music btn
  document.getElementById('music-btn').classList.toggle('visible', currentScene > 0);

  // Swipe area only active on photo/final/outro scenes
  document.getElementById('swipe-area').classList.toggle('active', currentScene > 0);
}

function startFilm() {
  // Start music
  startMusic();
  nextScene();
  updateUI();
}

function replayFilm() {
  // Fade music out
  fadeMusicOut();
  const all = getAllScenes();
  isTransitioning = true;
  const prev = all[currentScene];
  prev.classList.add('exiting');
  setTimeout(() => {
    prev.classList.remove('active','exiting');
    all.forEach(s => s.classList.remove('active'));
    all[0].classList.add('active');
    currentScene = 0;
    updateUI();
    isTransitioning = false;
  }, 1200);
}

/* ═══════════════════════════════════════════
   MUSIC
═══════════════════════════════════════════ */
function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  audio.volume = 0;
  audio.play().catch(() => {});
  fadeIn(audio, 0.55, 3000);
}

function fadeIn(el, target, ms) {
  const step = target / (ms / 50);
  const timer = setInterval(() => {
    el.volume = Math.min(el.volume + step, target);
    if (el.volume >= target) clearInterval(timer);
  }, 50);
}

function fadeMusicOut() {
  const timer = setInterval(() => {
    audio.volume = Math.max(audio.volume - 0.02, 0);
    if (audio.volume <= 0) {
      clearInterval(timer);
      audio.pause();
      audio.currentTime = 0;
      musicStarted = false;
    }
  }, 60);
}

function toggleMusic() {
  musicMuted = !musicMuted;
  audio.muted = musicMuted;
  document.getElementById('icon-sound').style.display = musicMuted ? 'none' : '';
  document.getElementById('icon-mute').style.display = musicMuted ? '' : 'none';
}

/* ═══════════════════════════════════════════
   PARTICLES
═══════════════════════════════════════════ */
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  const particles = Array.from({length: 60}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.4 + 0.3,
    vx: (Math.random() - 0.5) * 0.18,
    vy: -Math.random() * 0.25 - 0.08,
    a: Math.random(),
    va: (Math.random() - 0.5) * 0.006,
  }));

  function draw() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.a < 0) p.a = 0, p.va *= -1;
      if (p.a > 0.7) p.a = 0.7, p.va *= -1;
      if (p.y < -4) p.y = H + 4;
      if (p.x < -4) p.x = W + 4;
      if (p.x > W + 4) p.x = -4;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(214,178,94,${p.a * 0.6})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });
}

/* ═══════════════════════════════════════════
   SWIPE / KEYBOARD NAVIGATION
═══════════════════════════════════════════ */
function initNavigation() {
  let touchStartY = 0, touchStartX = 0;
  let lastScroll = 0;

  document.addEventListener('wheel', (e) => {
    if (currentScene === 0) return;
    const now = Date.now();
    if (now - lastScroll < 800) return;
    lastScroll = now;
    if (e.deltaY > 30) nextScene();
  }, { passive: true });

  document.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (currentScene === 0) return;
    const dy = touchStartY - e.changedTouches[0].clientY;
    const dx = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) {
      if (dy > 0) nextScene();
    }
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (['ArrowDown','ArrowRight','Space','Enter'].includes(e.code)) {
      if (currentScene === 0) return;
      e.preventDefault();
      nextScene();
    }
  });

  // Click navigation on photo scenes
  document.getElementById('swipe-area').addEventListener('click', (e) => {
    if (currentScene === 0) return;
    const w = window.innerWidth;
    // Only trigger if clicking right half or middle
    if (e.clientX > w * 0.2) nextScene();
  });
}

/* ═══════════════════════════════════════════
   LOADING SIMULATION
═══════════════════════════════════════════ */
function fakeLoad() {
  const bar = document.getElementById('loading-bar');
  const screen = document.getElementById('loading-screen');
  let pct = 0;
  const imgs = slides.map(s => {
    const img = new Image();
    img.src = s.image;
    return img;
  });

  const timer = setInterval(() => {
    pct += Math.random() * 8 + 2;
    if (pct > 92) pct = 92;
    bar.style.width = pct + '%';
  }, 120);

  // After 2.2s, finish loading
  setTimeout(() => {
    clearInterval(timer);
    bar.style.width = '100%';
    setTimeout(() => {
      screen.classList.add('fade-out');
      setTimeout(() => screen.remove(), 1000);
    }, 400);
  }, 2200);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildPhotoScenes();
  initParticles();
  initNavigation();
  fakeLoad();
});
</script>
